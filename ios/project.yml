name: LimtOS
options:
  bundleIdPrefix: com.limtos
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LimtOS:
    type: application
    platform: iOS
    sources:
      - path: LimtOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limtos.app
        PRODUCT_NAME: Limt OS
        INFOPLIST_KEY_CFBundleDisplayName: Limt OS
        INFOPLIST_KEY_LimtAPIBaseURL: ""
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
