name: Build Limt OS iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Commit generated Xcode project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/LimtOS.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "chore(ios): commit generated Xcode project [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No generated Xcode project changes to commit."
          fi

      - name: Build iOS Simulator app
        working-directory: ios
        env:
          LIMT_API_BASE_URL: ${{ secrets.LIMT_API_BASE_URL }}
        run: |
          xcodebuild -project LimtOS.xcodeproj -scheme LimtOS \
            -sdk iphonesimulator -configuration Release \
            -derivedDataPath build/simulator \
            INFOPLIST_KEY_LimtAPIBaseURL="${LIMT_API_BASE_URL:-}" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: limt-os-ios-simulator
          path: "ios/build/simulator/Build/Products/Release-iphonesimulator/Limt OS.app"
          if-no-files-found: error

      - name: Build unsigned iPhone app
        working-directory: ios
        env:
          LIMT_API_BASE_URL: ${{ secrets.LIMT_API_BASE_URL }}
        run: |
          xcodebuild -project LimtOS.xcodeproj -scheme LimtOS \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build/device \
            -destination 'generic/platform=iOS' \
            INFOPLIST_KEY_LimtAPIBaseURL="${LIMT_API_BASE_URL:-}" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="build/device/Build/Products/Release-iphoneos/Limt OS.app"
          test -d "$APP_PATH"
          mkdir -p build/unsigned-ipa/Payload
          cp -R "$APP_PATH" build/unsigned-ipa/Payload/
          cd build/unsigned-ipa
          /usr/bin/zip -qry ../LimtOS-unsigned.ipa Payload
          test -s ../LimtOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: limt-os-unsigned-ipa
          path: ios/build/LimtOS-unsigned.ipa
          if-no-files-found: error
