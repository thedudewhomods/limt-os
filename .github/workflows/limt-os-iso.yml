name: Limt-OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main, limt-os-bootable-iso]
    paths:
      - "src/**"
      - "scripts/omni-exec.py"
      - "scripts/validate_iso.py"
      - "build/iso/**"
      - "config/limt-settings.yaml"
      - ".github/workflows/limt-os-iso.yml"
      - "docs/ISO-BUILD.md"

permissions:
  contents: read

jobs:
  build-amd64-iso:
    name: Build x86-64 live ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # live-build must mount /proc and /dev/pts while preparing its chroot.
      # GitHub's job-level container is unprivileged, so run the Debian build
      # in a privileged Docker container on the hosted runner instead.
      - name: Build ISO in privileged Debian Bookworm container
        run: |
          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:bookworm \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap debian-archive-keyring \
                xorriso squashfs-tools grub-efi-amd64-bin grub-pc-bin \
                mtools dosfstools ca-certificates python3
              bash build/iso/build-iso.sh
            '

      - name: Verify ISO and checksum in out directory
        run: |
          set -euo pipefail
          test -s out/limt-os-amd64.iso
          test -s out/limt-os-amd64.iso.sha256
          (
            cd out
            sha256sum --check limt-os-amd64.iso.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: limt-os-amd64-iso
          path: |
            out/limt-os-amd64.iso
            out/limt-os-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14
