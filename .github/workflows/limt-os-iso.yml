name: Limt-OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main, limt-os-bootable-iso]
    paths:
      - "src/**"
      - "scripts/omni-exec.py"
      - "build/iso/**"
      - "config/limt-settings.yaml"
      - ".github/workflows/limt-os-iso.yml"
      - "docs/ISO-BUILD.md"

permissions:
  contents: read

jobs:
  build-amd64-iso:
    name: Build x86-64 live ISO
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian Bookworm live-build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools grub-efi-amd64-bin grub-pc-bin \
            mtools dosfstools ca-certificates python3
      - name: Build ISO
        run: bash build/iso/build-iso.sh
      - name: Verify ISO and checksum
        run: |
          test -s dist/limt-os-amd64.iso
          test -s dist/limt-os-amd64.iso.sha256
          sha256sum -c dist/limt-os-amd64.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: limt-os-amd64-iso
          path: |
            dist/limt-os-amd64.iso
            dist/limt-os-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14
